<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Invoice Galeri Florist</title>
<meta name="theme-color" content="#2369c3">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column (max 560px) like a phone order pad; bottom tab bar; sticky total bar on the invoice form. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --ink: #18222e;
  --muted: #5b6875;
  --line: #dde3ea;
  --accent: #2369c3;      /* stamp blue */
  --accent-ink: #ffffff;
  --accent-soft: #e6effa;
  --ok: #1d7a4c; --ok-soft: #e3f4ea;
  --warn: #9a5b00; --warn-soft: #fbf0dc;
  --danger: #b3261e; --danger-soft: #fbe7e5;
  --font-display: "Marcellus", "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 12px;
  --s1: #2a78d6; --s2: #eb6834; --grid: #e6eaef; --axis: #c3cbd4; --crit: #d03b3b;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --surface: #1a212a; --ink: #e8edf2; --muted: #9aa7b4; --line: #2c3642;
  --accent: #6ea8f0; --accent-ink: #0d1520; --accent-soft: #1d2d42;
  --ok: #6fd3a0; --ok-soft: #173326; --warn: #f0b860; --warn-soft: #3a2c14; --danger: #f2948c; --danger-soft: #3d1b19;
  --s1: #3987e5; --s2: #d95926; --grid: #263039; --axis: #3a4652; --crit: #e66767;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #1a212a; --ink: #e8edf2; --muted: #9aa7b4; --line: #2c3642;
  --accent: #6ea8f0; --accent-ink: #0d1520; --accent-soft: #1d2d42;
  --ok: #6fd3a0; --ok-soft: #173326; --warn: #f0b860; --warn-soft: #3a2c14; --danger: #f2948c; --danger-soft: #3d1b19;
  --s1: #3987e5; --s2: #d95926; --grid: #263039; --axis: #3a4652; --crit: #e66767;
  color-scheme: dark }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 140px; }
header.top { display: flex; align-items: center; gap: 12px; padding-block: 6px 14px; }
header.top img { width: 52px; height: 52px; object-fit: contain; border-radius: 10px; background: #fff; padding: 4px; border: 1px solid var(--line); }
header.top h1 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0; letter-spacing: .02em; text-wrap: balance; }
header.top p { margin: 0; color: var(--muted); font-size: 13px; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 4px 0 12px; text-wrap: balance; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; }
.stack { display: grid; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.row > * { flex: 1 1 120px; min-width: 0; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; }
input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; width: 100%; min-height: 44px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { min-height: 70px; resize: vertical; }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; font-weight: 600; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 14px; min-height: 44px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 6px; }
button.danger { color: var(--danger); border-color: var(--danger-soft); background: var(--danger-soft); }
button.sm { min-height: 36px; padding: 6px 10px; font-size: 14px; }
button:disabled { opacity: .55; cursor: default; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.item { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
.item-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.item-head strong { font-size: 13px; color: var(--muted); font-weight: 600; }
.line-total { font-weight: 700; }
.totals { display: grid; gap: 6px; }
.totals div { display: flex; justify-content: space-between; gap: 12px; }
.totals .grand { font-size: 18px; font-weight: 700; border-top: 1px solid var(--line); padding-top: 8px; }
.billto { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.billto b { display: block; font-size: 15px; }
.chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; letter-spacing: .02em; }
.chip.paid { background: var(--ok-soft); color: var(--ok); }
.chip.unpaid { background: var(--warn-soft); color: var(--warn); }
.list { display: grid; gap: 10px; }
.li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; }
.li-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.li-top b { min-width: 0; overflow-wrap: anywhere; }
.li-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.empty { text-align: center; padding: 26px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }
.banner { border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.banner.info { background: var(--accent-soft); }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.ok { background: var(--ok-soft); color: var(--ok); }
.banner.err { background: var(--danger-soft); color: var(--danger); }
.sticky-total { position: fixed; left: 0; right: 0; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); z-index: 5; }
.sticky-total .in { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; gap: 12px; align-items: center; }
.sticky-total .in > div { flex: 1; min-width: 0; }
.sticky-total .lbl { font-size: 12px; color: var(--muted); }
.sticky-total .val { font-size: 19px; font-weight: 700; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 6; }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs button { border: 0; border-radius: 0; background: transparent; color: var(--muted); font-size: 11.5px; font-weight: 600; min-height: 60px; padding: 6px 2px; display: grid; justify-items: center; gap: 3px; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.kpi .k { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.kpi .v { font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
.kpi .d { font-size: 12px; color: var(--muted); }
.kpi.hero { grid-column: 1 / -1; }
.kpi.hero .v { font-size: 28px; }
.delta-up { color: var(--ok); } .delta-down { color: var(--danger); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.4; white-space: nowrap; z-index: 3; transform: translate(-50%, -100%); }
.tip b { display: block; font-size: 13px; }
.hbar { display: grid; gap: 4px; }
.hbar .name { font-size: 13.5px; overflow-wrap: anywhere; }
.hbar .row2 { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.hbar .val { font-size: 13px; white-space: nowrap; color: var(--muted); }
.hbar .val b { color: var(--ink); }
.hbar .track { height: 10px; min-width: 0; }
.hbar .fill { height: 10px; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.t td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t td.r, table.t th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.overdue { color: var(--crit); font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
.search { position: relative; }
details > summary { cursor: pointer; font-weight: 600; color: var(--accent); min-height: 32px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 0 0 auto; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .2s ease-out; } @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } } }
html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); }
</style>
</head>

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rp = (n) => "Rp " + Math.round(Number(n) || 0).toLocaleString("id-ID");
const num = (v) => { if (typeof v === "number") return v; const n = Number(String(v ?? "").replace(/[^\d,.-]/g, "").replace(/\./g, "").replace(",", ".")); return isFinite(n) ? n : 0; };
const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + Number(n || 0)); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const tglID = (iso) => { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); return `${d} ${BULAN[m - 1]} ${y}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fileSafe = (s) => String(s).replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, " ").trim();

function terbilang(n) {
  n = Math.floor(Math.abs(n));
  const s = ["", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "delapan", "sembilan", "sepuluh", "sebelas"];
  const f = (x) => {
    if (x < 12) return s[x];
    if (x < 20) return f(x - 10) + " belas";
    if (x < 100) return f(Math.floor(x / 10)) + " puluh" + (x % 10 ? " " + f(x % 10) : "");
    if (x < 200) return "seratus" + (x - 100 ? " " + f(x - 100) : "");
    if (x < 1000) return f(Math.floor(x / 100)) + " ratus" + (x % 100 ? " " + f(x % 100) : "");
    if (x < 2000) return "seribu" + (x - 1000 ? " " + f(x - 1000) : "");
    if (x < 1e6) return f(Math.floor(x / 1000)) + " ribu" + (x % 1000 ? " " + f(x % 1000) : "");
    if (x < 1e9) return f(Math.floor(x / 1e6)) + " juta" + (x % 1e6 ? " " + f(x % 1e6) : "");
    if (x < 1e12) return f(Math.floor(x / 1e9)) + " miliar" + (x % 1e9 ? " " + f(x % 1e9) : "");
    return f(Math.floor(x / 1e12)) + " triliun" + (x % 1e12 ? " " + f(x % 1e12) : "");
  };
  const t = n === 0 ? "nol" : f(n);
  return t.charAt(0).toUpperCase() + t.slice(1) + " rupiah";
}

let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), Math.min(9000, 2500 + msg.length * 45));
}

function sortedBy(arr, key) { return [...arr].sort((a, b) => String(a[key] || "").localeCompare(String(b[key] || ""), "id", { numeric: true })); }

/* ---------- draft ---------- */
function nextInvoiceNumber(dateISO) {
  const [y, m] = (dateISO || todayISO()).split("-");
  const prefix = `INV/${y}/${m}/`;
  let max = 0;
  for (const inv of S.invoices) if (String(inv.number || "").startsWith(prefix)) max = Math.max(max, parseInt(inv.number.slice(prefix.length), 10) || 0);
  return prefix + String(max + 1).padStart(3, "0");
}
function nextCode(list, prefix) {
  let max = 0;
  for (const x of list) { const m = String(x.code || "").match(/(\d+)$/); if (m && String(x.code).startsWith(prefix)) max = Math.max(max, +m[1]); }
  return prefix + String(max + 1).padStart(3, "0");
}
function newItem() { return { productId: "", desc: "", unit: "", qty: 1, price: 0 }; }
function freshDraft() {
  const date = todayISO();
  const acc = sortedBy(S.accounts, "order");
  return {
    number: nextInvoiceNumber(date), date, dueDays: S.biz.dueDays ?? 14, customerId: "",
    items: [newItem()], discountPct: 0, ppnPct: "",
    acc1: acc[0]?.id || "", acc2: acc[1]?.id || "", note: "", editingId: null, status: "Belum Lunas",
  };
}
function saveDraftLocal() { try { localStorage.setItem("gf-draft", JSON.stringify({ d: S.draft, t: S.numberTouched })); } catch {} }
function loadDraftLocal() { try { const v = JSON.parse(localStorage.getItem("gf-draft") || "null"); if (v && v.d && Array.isArray(v.d.items)) { S.draft = v.d; S.numberTouched = !!v.t; } } catch {} }

function calc(d) {
  const lines = d.items.map((it) => (Number(it.qty) || 0) * (Number(it.price) || 0));
  const subtotal = lines.reduce((a, b) => a + b, 0);
  const discount = Math.round(subtotal * (Number(d.discountPct) || 0) / 100);
  const ppn = Math.round((subtotal - discount) * (Number(d.ppnPct) || 0) / 100);
  return { lines, subtotal, discount, ppn, total: subtotal - discount + ppn };
}

/* ---------- Google Sheets connection ---------- */
const CFG_KEY = "gf-config", CACHE_KEY = "gf-cache";
const lsGet = (k) => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } };
const lsSet = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} };
S.cfg = lsGet(CFG_KEY);
S.online = false; S.syncing = false; S.lastSync = null; S.installEvt = null;

async function api(payload) {
  const res = await fetch(S.cfg.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ ...payload, key: S.cfg.key }) });
  let j; try { j = await res.json(); } catch { const e = new Error("bad_response"); e.code = "bad_response"; throw e; }
  if (!j.ok) { const e = new Error(j.error || "error"); e.code = j.error; throw e; }
  return j;
}
// Google Sheets turns typed phone/account numbers into numbers (and drops a leading 0); keep them as text.
const txt = (v) => (v === null || v === undefined ? "" : String(v));
const phoneTxt = (v) => { const s = txt(v).trim(); return typeof v === "number" && /^[1-9]\d{7,12}$/.test(s) && s[0] === "8" ? "0" + s : s; };
function normCustomer(c) { return { ...c, code: txt(c.code), name: txt(c.name), address: txt(c.address), phone: phoneTxt(c.phone), email: txt(c.email) }; }
function normInvoice(r) {
  return { ...r, number: txt(r.number), date: txt(r.date), due: txt(r.due),
    customer: normCustomer(r.customer || {}),
    items: (r.items || []).map((it) => ({ ...it, desc: txt(it.desc), unit: txt(it.unit), qty: Number(it.qty) || 0, price: Number(it.price) || 0 })),
    accounts: (r.accounts || []).map((a) => ({ bank: txt(a.bank), number: txt(a.number), holder: txt(a.holder) })), note: txt(r.note) };
}
function applyData(d) {
  S.customers = (d.customers || []).map(normCustomer);
  S.products = (d.products || []).map((p) => ({ ...p, code: txt(p.code), name: txt(p.name), unit: txt(p.unit), price: Number(p.price) || 0 }));
  S.accounts = (d.accounts || []).map((a) => ({ ...a, bank: txt(a.bank), number: txt(a.number), holder: txt(a.holder) }));
  S.invoices = (d.invoices || []).map(normInvoice);
  S.cash = (d.cash || []).map((c) => ({ ...c, date: txt(c.date), type: c.type === "Keluar" ? "Keluar" : "Masuk", category: txt(c.category), note: txt(c.note), method: txt(c.method), arranger: txt(c.arranger), amount: Number(c.amount) || 0 }));
  S.cashSupported = Array.isArray(d.cash);
  const b = { ...DEFAULT_BIZ, ...(d.biz || {}) };
  S.biz = { ...b, name: txt(b.name), address1: txt(b.address1), address2: txt(b.address2), phone: phoneTxt(b.phone), email: txt(b.email), notes: txt(b.notes) };
  if (S.draft && !S.numberTouched && !S.draft.editingId) S.draft.number = nextInvoiceNumber(S.draft.date);
}
function cacheNow() { lsSet(CACHE_KEY, { customers: S.customers, products: S.products, accounts: S.accounts, invoices: S.invoices, cash: S.cashSupported ? S.cash : undefined, biz: S.biz, at: Date.now() }); }
async function pull(silent) {
  if (!S.cfg || S.syncing) return;
  S.syncing = true; setSync();
  try { const j = await api({ action: "all" }); applyData(j.data); cacheNow(); S.online = true; S.lastSync = new Date(); }
  catch (e) {
    S.online = false;
    if (e.code === "unauthorized") toast("Kode akses ditolak. Periksa di menu Lainnya → Koneksi.");
    else if (!silent) toast("Tidak bisa memuat data. Periksa koneksi internet.");
  }
  S.syncing = false; setSync(); softRender();
}
function setSync() {
  const el = $("#sync"); if (!el) return;
  if (!S.cfg) el.textContent = "Belum terhubung ke Google Sheets";
  else if (S.syncing) el.textContent = "Menyinkronkan…";
  else if (S.online) el.textContent = "Tersinkron dengan Google Sheets · " + S.lastSync.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
  else el.textContent = "Offline — menampilkan data terakhir";
}
// Re-render unless the user is typing inside the current view.
function softRender() {
  const a = document.activeElement;
  if (a && a.closest && a.closest("#view") && /INPUT|TEXTAREA/.test(a.tagName)) return;
  render();
}
function localPut(coll, id, data) {
  if (coll === "settings") { S.biz = { ...DEFAULT_BIZ, ...data }; return; }
  const i = S[coll].findIndex((x) => x.id === id); const row = { id, ...data };
  if (i >= 0) S[coll][i] = row; else S[coll].push(row);
}
function writeFailed(e) {
  if (e && e.code === "unauthorized") toast("Kode akses ditolak — perubahan tidak tersimpan.");
  else if (e && /unknown collection/.test(e.message || "")) { S.cashSupported = false; toast("Google Sheets perlu diperbarui untuk menyimpan kas. Tempel Code.gs terbaru lalu Deploy versi baru."); }
  else toast("Gagal menyimpan ke Google Sheets. Periksa internet lalu coba lagi.");
  pull(true);
}
async function put(coll, id, data) {
  if (!S.cfg) { toast("Hubungkan ke Google Sheets dulu."); throw new Error("nocfg"); }
  try { await api(coll === "settings" ? { action: "settings", data } : { action: "put", coll, id, data }); }
  catch (e) { writeFailed(e); throw e; }
  localPut(coll, id, data); cacheNow();
}
async function putMany(coll, rows) {
  for (let i = 0; i < rows.length; i += 100) {
    const chunk = rows.slice(i, i + 100);
    await api({ action: "bulk", coll, rows: chunk });
    chunk.forEach((r) => localPut(coll, r.id, r.data));
  }
  cacheNow();
}
async function remove(coll, id) {
  try { await api({ action: "delete", coll, id }); } catch (e) { writeFailed(e); throw e; }
  S[coll] = S[coll].filter((x) => x.id !== id); cacheNow();
}
const clean = (o) => { const r = { ...o }; delete r.id; return r; };

function setupLink() {
  const t = btoa(unescape(encodeURIComponent(JSON.stringify({ u: S.cfg.url, k: S.cfg.key })))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return location.origin + location.pathname + "#setup=" + t;
}
function readSetupHash() {
  const m = location.hash.match(/#setup=([\w-]+)/); if (!m) return null;
  try { const j = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, "+").replace(/_/g, "/"))))); history.replaceState(null, "", location.pathname); return j.u && j.k ? { url: j.u, key: j.k } : null; } catch { return null; }
}
async function connect(url, key) {
  url = url.trim(); key = key.trim().toUpperCase();
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)) { toast("URL harus diawali https://script.google.com/…"); return false; }
  if (!key) { toast("Isi kode akses."); return false; }
  const prev = S.cfg; S.cfg = { url, key };
  try { await api({ action: "ping" }); }
  catch (e) { S.cfg = prev; toast(e.code === "unauthorized" ? "Kode akses salah." : "Tidak bisa terhubung. Periksa URL dan pastikan deploy diatur 'Siapa saja'."); return false; }
  lsSet(CFG_KEY, S.cfg); toast("Terhubung ke Google Sheets."); await pull(); return true;
}

/* ---------- Dashboard ---------- */
const BLN = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
const ym = (iso) => String(iso || "").slice(0, 7);
const ymLabel = (k, long) => { const [y, m] = k.split("-").map(Number); return (long ? BULAN[m - 1] : BLN[m - 1]) + " " + y; };
const ymShift = (k, n) => { let [y, m] = k.split("-").map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${String(m).padStart(2, "0")}`; };
const rpShort = (n) => n >= 1e9 ? (n / 1e9).toLocaleString("id-ID", { maximumFractionDigits: 1 }) + " M" : n >= 1e6 ? (n / 1e6).toLocaleString("id-ID", { maximumFractionDigits: 1 }) + " jt" : n >= 1e3 ? Math.round(n / 1e3).toLocaleString("id-ID") + " rb" : String(Math.round(n));
const paid = (r) => r.status === "Lunas";

function periodOf(key) {
  const now = ym(todayISO());
  if (key === "this") return { label: "Bulan ini · " + ymLabel(now, true), test: (r) => ym(r.date) === now, prev: (r) => ym(r.date) === ymShift(now, -1), prevLabel: ymLabel(ymShift(now, -1), true) };
  if (key === "last") { const m = ymShift(now, -1); return { label: "Bulan lalu · " + ymLabel(m, true), test: (r) => ym(r.date) === m, prev: (r) => ym(r.date) === ymShift(m, -1), prevLabel: ymLabel(ymShift(m, -1), true) }; }
  if (key === "year") { const y = now.slice(0, 4); return { label: "Tahun " + y, test: (r) => String(r.date).startsWith(y), prev: (r) => String(r.date).startsWith(String(+y - 1)), prevLabel: "tahun " + (+y - 1) }; }
  if (key && key.startsWith("m:")) { const m = key.slice(2); return { label: ymLabel(m, true), test: (r) => ym(r.date) === m, prev: (r) => ym(r.date) === ymShift(m, -1), prevLabel: ymLabel(ymShift(m, -1), true) }; }
  return { label: "Semua waktu", test: () => true, prev: null };
}

function dashData() {
  const P = periodOf(S.dashPeriod || "this");
  const all = S.invoices.filter((r) => r.date && Number(r.total) >= 0);
  const rows = all.filter(P.test);
  const sum = (a) => a.reduce((t, r) => t + (Number(r.total) || 0), 0);
  const omzet = sum(rows), lunas = sum(rows.filter(paid)), piutang = omzet - lunas;
  const prevOmzet = P.prev ? sum(all.filter(P.prev)) : null;
  // products: by productId when present, else by description
  const prod = new Map();
  rows.forEach((r) => (r.items || []).forEach((it) => {
    const key = it.productId || it.desc; const p = S.products.find((x) => x.id === it.productId);
    const o = prod.get(key) || { name: p ? p.name : it.desc, qty: 0, total: 0 };
    o.qty += Number(it.qty) || 0; o.total += (Number(it.qty) || 0) * (Number(it.price) || 0); prod.set(key, o);
  }));
  const cust = new Map();
  rows.forEach((r) => { const k = r.customerId || r.customer?.name; const o = cust.get(k) || { name: r.customer?.name || "Tanpa nama", n: 0, total: 0, unpaid: 0 }; o.n++; o.total += Number(r.total) || 0; if (!paid(r)) o.unpaid += Number(r.total) || 0; cust.set(k, o); });
  // last 12 months ending at the newer of today or the latest invoice
  const latest = all.reduce((m, r) => (ym(r.date) > m ? ym(r.date) : m), ym(todayISO()));
  const months = Array.from({ length: 12 }, (_, i) => ymShift(latest, i - 11)).map((k) => {
    const rs = all.filter((r) => ym(r.date) === k);
    return { k, lunas: sum(rs.filter(paid)), belum: sum(rs.filter((r) => !paid(r))), n: rs.length };
  });
  const today = todayISO();
  const unpaid = all.filter((r) => !paid(r)).sort((a, b) => String(a.due).localeCompare(String(b.due)));
  return { P, rows, omzet, lunas, piutang, prevOmzet, months, unpaid, today,
    products: [...prod.values()].sort((a, b) => b.total - a.total), customers: [...cust.values()].sort((a, b) => b.total - a.total) };
}

function niceMax(v) { if (v <= 0) return 1e6; const e = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * e >= v) return m * e; return 10 * e; }

function monthChart(months, width) {
  const W = Math.max(300, Math.round(width)), H = 210, L = 44, Rr = 6, T = 26, B = 24;
  const max = niceMax(Math.max(...months.map((m) => m.lunas + m.belum)));
  const pw = W - L - Rr, ph = H - T - B, bw = pw / months.length, bar = Math.min(22, bw * 0.62);
  const y = (v) => T + ph - (v / max) * ph;
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = (max / 4) * i, yy = y(v); g += `<line x1="${L}" x2="${W - Rr}" y1="${yy}" y2="${yy}" stroke="var(--${i ? "grid" : "axis"})" stroke-width="1"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${i ? rpShort(v) : "0"}</text>`; }
  const peak = months.reduce((a, m, i) => (m.lunas + m.belum > months[a].lunas + months[a].belum ? i : a), 0);
  months.forEach((m, i) => {
    const cx = L + bw * i + bw / 2, x = cx - bar / 2, tot = m.lunas + m.belum;
    const yl = y(m.lunas), yt = y(tot), gap = m.lunas && m.belum ? 2 : 0;
    const r = Math.min(4, bar / 2);
    const top = (x0, y0, h) => h <= 0 ? "" : `M${x0},${y0 + h}V${y0 + Math.min(r, h)}Q${x0},${y0} ${x0 + Math.min(r, h)},${y0}H${x0 + bar - Math.min(r, h)}Q${x0 + bar},${y0} ${x0 + bar},${y0 + Math.min(r, h)}V${y0 + h}Z`;
    if (m.lunas) g += m.belum ? `<rect x="${x}" y="${yl}" width="${bar}" height="${y(0) - yl}" fill="var(--s1)"/>` : `<path d="${top(x, yl, y(0) - yl)}" fill="var(--s1)"/>`;
    if (m.belum) g += `<path d="${top(x, yt, Math.max(0, yl - gap - yt))}" fill="var(--s2)"/>`;
    const lab = i % 2 === months.length % 2 || i === months.length - 1;
    if (lab) g += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${BLN[+m.k.slice(5) - 1]}${m.k.slice(5) === "01" || i === 0 ? " " + m.k.slice(2, 4) : ""}</text>`;
    if (tot && (i === months.length - 1 || i === peak)) g += `<text x="${cx}" y="${yt - 6}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${rpShort(tot)}</text>`;
    g += `<rect data-bar="${i}" x="${L + bw * i}" y="${T - 20}" width="${bw}" height="${ph + 20}" fill="transparent" style="cursor:pointer"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Omzet per bulan, 12 bulan terakhir">${g}</svg>`;
}

/* ---------- Kas (uang masuk & keluar) ---------- */
const KAS_CAT = {
  Masuk: ["Penjualan tanpa invoice", "Uang muka / DP", "Modal", "Lainnya"],
  Keluar: ["Upah perangkai", "Bunga & bahan", "Gaji karyawan", "Transport & pengiriman", "Sewa tempat", "Listrik, air & internet", "Peralatan", "Pajak", "Lainnya"],
};
const localDate = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
function cashEntries() {
  // Paid invoices count as money in on the day they were marked paid.
  const inv = S.invoices.filter(paid).map((r) => ({ id: "inv:" + r.id, invId: r.id, date: (r.paidAt && localDate(r.paidAt)) || r.date, type: "Masuk", category: "Pembayaran invoice", amount: Number(r.total) || 0, note: `${r.number} · ${r.customer?.name || ""}`, method: "", auto: true }));
  return [...inv, ...S.cash.map((c) => ({ ...c, amount: Number(c.amount) || 0 }))];
}
function kasData() {
  const P = periodOf(S.kasPeriod || "this");
  const all = cashEntries().filter((c) => c.date);
  const rows = all.filter(P.test).sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
  const sum = (a) => a.reduce((t, c) => t + c.amount, 0);
  const masuk = sum(rows.filter((c) => c.type === "Masuk")), keluar = sum(rows.filter((c) => c.type === "Keluar"));
  const cats = new Map(); rows.filter((c) => c.type === "Keluar").forEach((c) => cats.set(c.category || "Lainnya", (cats.get(c.category || "Lainnya") || 0) + c.amount));
  const latest = all.reduce((m, c) => (ym(c.date) > m ? ym(c.date) : m), ym(todayISO()));
  const months = Array.from({ length: 6 }, (_, i) => ymShift(latest, i - 5)).map((k) => { const rs = all.filter((c) => ym(c.date) === k); return { k, masuk: sum(rs.filter((c) => c.type === "Masuk")), keluar: sum(rs.filter((c) => c.type === "Keluar")) }; });
  const arr = new Map(); rows.filter((c) => c.type === "Keluar" && c.arranger).forEach((c) => { const o = arr.get(c.arranger) || { name: c.arranger, n: 0, total: 0 }; o.n++; o.total += c.amount; arr.set(c.arranger, o); });
  return { P, rows, masuk, keluar, saldo: masuk - keluar, arrangers: [...arr.values()].sort((a, b) => b.total - a.total), cats: [...cats.entries()].map(([name, total]) => ({ name, total })).sort((a, b) => b.total - a.total), months };
}

function kasChart(months, width) {
  const W = Math.max(300, Math.round(width)), H = 190, L = 44, Rr = 6, T = 22, B = 24;
  const max = niceMax(Math.max(...months.map((m) => Math.max(m.masuk, m.keluar))));
  const pw = W - L - Rr, ph = H - T - B, bw = pw / months.length, bar = Math.min(16, bw * 0.3);
  const y = (v) => T + ph - (v / max) * ph;
  const col = (x, v, c) => { if (!v) return ""; const h = y(0) - y(v), r = Math.min(4, bar / 2, h); return `<path d="M${x},${y(0)}V${y(v) + r}Q${x},${y(v)} ${x + r},${y(v)}H${x + bar - r}Q${x + bar},${y(v)} ${x + bar},${y(v) + r}V${y(0)}Z" fill="var(--${c})"/>`; };
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = (max / 4) * i, yy = y(v); g += `<line x1="${L}" x2="${W - Rr}" y1="${yy}" y2="${yy}" stroke="var(--${i ? "grid" : "axis"})"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${i ? rpShort(v) : "0"}</text>`; }
  months.forEach((m, i) => {
    const cx = L + bw * i + bw / 2;
    g += col(cx - bar - 1, m.masuk, "s1") + col(cx + 1, m.keluar, "s2");
    g += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${BLN[+m.k.slice(5) - 1]}</text>`;
    g += `<rect data-kbar="${i}" x="${L + bw * i}" y="${T - 16}" width="${bw}" height="${ph + 16}" fill="transparent" style="cursor:pointer"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Uang masuk dan keluar per bulan, 6 bulan terakhir">${g}</svg>`;
}

function invoiceFromDraft() {
  const d = S.draft; const c = calc(d);
  const cust = S.customers.find((x) => x.id === d.customerId) || {};
  const accs = [d.acc1, d.acc2].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).map((id) => S.accounts.find((a) => a.id === id)).filter(Boolean).map((a) => ({ bank: a.bank, number: a.number, holder: a.holder }));
  return {
    number: d.number.trim(), date: d.date, due: addDays(d.date, d.dueDays),
    customerId: d.customerId, customer: { name: cust.name || "", address: cust.address || "", phone: cust.phone || "", email: cust.email || "", code: cust.code || "" },
    items: d.items.filter((it) => it.desc.trim() && Number(it.qty) > 0).map((it) => ({ desc: it.desc.trim(), unit: it.unit || "", qty: Number(it.qty), price: Number(it.price) || 0, productId: it.productId || "" })),
    discountPct: Number(d.discountPct) || 0, ppnPct: Number(d.ppnPct) || 0,
    subtotal: c.subtotal, discount: c.discount, ppn: c.ppn, total: c.total,
    accounts: accs, note: d.note || "", status: d.status === "Lunas" ? "Lunas" : "Belum Lunas",
  };
}

function buildPdf(inv) {
  inv = normInvoice(inv);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const W = 210, M = 16, R = W - M;
  const INK = [24, 34, 46], MUTED = [91, 104, 117], ACC = [35, 105, 195];
  const biz = S.biz;
  doc.setFont("helvetica", "normal");

  doc.addImage(LOGO, "JPEG", M, 12, 40, 31.6);
  doc.setTextColor(...INK); doc.setFont("helvetica", "bold"); doc.setFontSize(26);
  doc.text("INVOICE", R, 22, { align: "right" });
  doc.setFontSize(9.5);
  const meta = [["No. Invoice", inv.number], ["Tanggal", tglID(inv.date)], ["Jatuh Tempo", tglID(inv.due)]];
  meta.forEach(([k, v], i) => { const y = 30 + i * 5.2; doc.setFont("helvetica", "normal"); doc.setTextColor(...MUTED); doc.text(k, R - 62, y); doc.setTextColor(...INK); doc.setFont("helvetica", "bold"); doc.text(v, R, y, { align: "right" }); });
  const PAID = inv.status === "Lunas", GREEN = [29, 122, 76];
  if (PAID) {
    doc.setFillColor(...GREEN); doc.roundedRect(R - 26, 42.3, 26, 5.2, 1.2, 1.2, "F");

function downloadBlob(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}
function pdfFor(inv) {
  if (!window.jspdf || !window.jspdf.jsPDF) { toast("Pembuat PDF belum termuat. Sambungkan internet sekali lalu buka ulang aplikasi."); return null; }
  const name = fileSafe(`${inv.number.replace(/\//g, "-")} - ${inv.customer.name || "Pelanggan"}`) + ".pdf";
  return { name, blob: buildPdf(inv).output("blob") };
}
// mode "share" opens Android's share sheet (WhatsApp, email, Drive); falls back to download.
async function savePdf(inv, mode = "share") {
  let p;
  try { p = pdfFor(inv); } catch (e) { toast("PDF gagal dibuat: " + (e && e.message || e)); return; }
  if (!p) return;
  if (mode === "share") {
    const file = new File([p.blob], p.name, { type: "application/pdf", lastModified: Date.now() });
    if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
      const t0 = Date.now();
      // Files only: with a title or text attached, some apps (WhatsApp) take the text and drop the PDF.
      try { await navigator.share({ files: [file] }); return; }
      catch (e) {
        // A real "cancel" comes after the sheet was open; an instant AbortError means the phone refused.
        if (e && e.name === "AbortError" && Date.now() - t0 > 800) return;
        downloadBlob(p.blob, p.name);
        toast("Kirim langsung tidak didukung di HP ini (" + (e && e.name || "error") + "). PDF diunduh ke folder Download — kirim dari WhatsApp > Dokumen.");
        return;
      }
    }
    downloadBlob(p.blob, p.name);
    toast("HP ini belum mendukung kirim langsung. PDF diunduh ke folder Download — kirim dari WhatsApp > Dokumen.");
    return;
  }
  downloadBlob(p.blob, p.name); toast("PDF tersimpan di folder Download: " + p.name);
}

/* ---------- Excel ---------- */
const HEADS = {
  customers: { code: /^(id|kode|id pelanggan|kode pelanggan|no\.? ?pelanggan)$/, name: /nama|name|pelanggan|customer/, address: /alamat|address/, phone: /telp|telepon|phone|hp|wa|whatsapp|kontak/, email: /e-?mail/ },
  products: { code: /^(kode|id|sku|kode produk)$/, name: /nama|produk|deskripsi|item|product|jasa/, price: /harga|price|tarif/, unit: /satuan|unit/ },
  accounts: { holder: /atas nama|pemilik|holder/, bank: /^bank$|nama bank/, number: /rek|nomor|no\.?|number|account/ },
};
function detectKind(sheetName, headers) {
  const n = sheetName.toLowerCase();
  if (/pelanggan|customer|konsumen/.test(n)) return "customers";
  if (/produk|product|barang|harga/.test(n)) return "products";
  if (/rekening|bank/.test(n)) return "accounts";
  const h = headers.join(" ");
  if (/alamat|telp|telepon|email/.test(h)) return "customers";
  if (/harga|satuan/.test(h)) return "products";
  return null;
}
function mapRows(rows, kind) {
  // find header row within first 10 rows
  let hi = -1, map = null;
  for (let r = 0; r < Math.min(rows.length, 10); r++) {
    const heads = rows[r].map((c) => String(c).trim().toLowerCase());
    const m = {};
    heads.forEach((h, ci) => { if (!h) return; for (const [k, re] of Object.entries(HEADS[kind])) if (!(k in m) && re.test(h)) { m[k] = ci; break; } });
    if ("name" in m || ("bank" in m && "number" in m)) { hi = r; map = m; break; }
  }
  if (hi < 0) return [];
  const out = [];
  for (const row of rows.slice(hi + 1)) {
    const o = {}; for (const [k, ci] of Object.entries(map)) o[k] = String(row[ci] ?? "").trim();
    if (kind !== "accounts" && !o.name) continue;
    if (kind === "accounts" && !o.number) continue;
    if (/^contoh/i.test(o.name || "")) continue;
    if (kind === "products") o.price = num(row[map.price]);
    out.push(o);
  }
  return out;
}
async function readExcel(file) {
  S.importMsg = null;
  if (!window.XLSX) { S.importMsg = { kind: "err", text: "Pembaca Excel belum termuat. Periksa koneksi lalu muat ulang." }; render(); return; }
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });
    const found = { customers: [], products: [], accounts: [] };
    const named = wb.SheetNames.filter((n) => detectKind(n, []));
    for (const name of wb.SheetNames) {
      if (named.length && !named.includes(name)) continue;
      if (/invoice|petunjuk|riwayat|cara/i.test(name)) continue;
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: "", raw: true });
      const heads = (rows.find((r) => r.some((c) => String(c).trim())) || []).map((c) => String(c).toLowerCase());
      const kind = detectKind(wb.SheetNames.length === 1 && /\.csv$/i.test(file.name) ? "" : name, heads) || detectKind("", rows.slice(0, 10).flat().map((c) => String(c).toLowerCase()));
      if (!kind) continue;
      found[kind].push(...mapRows(rows, kind));
    }
    const summary = [];
    const plan = {};
    for (const [kind, label, list] of [["customers", "pelanggan", S.customers], ["products", "produk", S.products], ["accounts", "rekening", S.accounts]]) {
      const rows = found[kind]; if (!rows.length) continue;
      let add = 0, upd = 0;
      plan[kind] = rows.map((r) => {
        const key = kind === "accounts" ? (x) => String(x.number).replace(/\D/g, "") === String(r.number).replace(/\D/g, "")
          : (x) => (r.code && x.code && x.code.toLowerCase() === r.code.toLowerCase()) || (!r.code && x.name && x.name.toLowerCase() === r.name.toLowerCase());
        const ex = list.find(key);
        ex ? upd++ : add++;
        return { id: ex ? ex.id : null, row: r };
      });
      summary.push(`${rows.length} ${label} (${add} baru, ${upd} diperbarui)`);
    }
    if (!summary.length) { S.importMsg = { kind: "warn", text: "Tidak ada data yang dikenali. Pastikan baris judul memuat kolom seperti Nama, Alamat, Telepon (pelanggan) atau Nama Produk, Harga (produk)." }; S.pendingImport = null; }
    else S.pendingImport = { file: file.name, summary, plan };
  } catch (e) { S.importMsg = { kind: "err", text: "File tidak bisa dibaca. Simpan ulang sebagai .xlsx lalu coba lagi." }; }
  render();
}
async function doImport() {
  const { plan } = S.pendingImport; S.pendingImport = null; S.importMsg = { kind: "info", text: "Mengimpor ke Google Sheets…" }; render();
  let n = 0;
  try {
    const custs = [...S.customers], prods = [...S.products];
    const cRows = (plan.customers || []).map(({ id, row }) => {
      const old = S.customers.find((c) => c.id === id) || {};
      const code = row.code || old.code || nextCode(custs, "CUST-");
      const nid = id || uid(); if (!id) custs.push({ id: nid, code });
      return { id: nid, data: { code, name: row.name, address: row.address ?? old.address ?? "", phone: row.phone ?? old.phone ?? "", email: row.email ?? old.email ?? "", createdAt: old.createdAt || new Date().toISOString() } };
    });
    const pRows = (plan.products || []).map(({ id, row }) => {
      const old = S.products.find((c) => c.id === id) || {};
      const code = row.code || old.code || nextCode(prods, "PRD-");
      const nid = id || uid(); if (!id) prods.push({ id: nid, code });
      return { id: nid, data: { code, name: row.name, unit: row.unit ?? old.unit ?? "", price: row.price || old.price || 0 } };
    });
    let order = S.accounts.length;
    const aRows = (plan.accounts || []).map(({ id, row }) => {
      const old = S.accounts.find((c) => c.id === id) || {};
      return { id: id || uid(), data: { bank: row.bank || old.bank || "Bank", number: row.number.replace(/\s/g, ""), holder: row.holder || old.holder || "", order: old.order ?? order++ } };
    });
    if (cRows.length) { await putMany("customers", cRows); n += cRows.length; }
    if (pRows.length) { await putMany("products", pRows); n += pRows.length; }
    if (aRows.length) { await putMany("accounts", aRows); n += aRows.length; }
    S.importMsg = { kind: "ok", text: `${n} data berhasil diimpor ke Google Sheets.` };
  } catch (e) { S.importMsg = { kind: "err", text: `Impor berhenti setelah ${n} data. Periksa internet lalu coba lagi.` }; pull(true); }
  render();
}
async function exportExcel() {
  if (!window.XLSX) { toast("Pembuat Excel belum termuat. Periksa koneksi lalu muat ulang."); return; }
  const wb = XLSX.utils.book_new();
  const add = (name, rows, cols) => { const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [Object.fromEntries(cols.map((c) => [c, ""]))], { header: cols }); ws["!cols"] = cols.map((c) => ({ wch: Math.max(12, c.length + 4, ...rows.map((r) => String(r[c] ?? "").length + 2).slice(0, 200)) })); XLSX.utils.book_append_sheet(wb, ws, name); };
  add("Pelanggan", sortedBy(S.customers, "code").map((c) => ({ "ID Pelanggan": c.code, Nama: c.name, Alamat: c.address, Telepon: c.phone, Email: c.email })), ["ID Pelanggan", "Nama", "Alamat", "Telepon", "Email"]);
  add("Produk", sortedBy(S.products, "code").map((p) => ({ Kode: p.code, "Nama Produk / Jasa": p.name, Satuan: p.unit, "Harga Satuan (Rp)": Number(p.price) || 0 })), ["Kode", "Nama Produk / Jasa", "Satuan", "Harga Satuan (Rp)"]);
  add("Rekening", sortedBy(S.accounts, "order").map((a) => ({ Bank: a.bank, "No. Rekening": a.number, "Atas Nama": a.holder })), ["Bank", "No. Rekening", "Atas Nama"]);
  const inv = [...S.invoices].sort((a, b) => String(a.createdAt || "").localeCompare(String(b.createdAt || "")));
  add("Riwayat Invoice", inv.map((r) => ({ "No. Invoice": r.number, Tanggal: r.date, "Jatuh Tempo": r.due, "ID Pelanggan": r.customer?.code || "", Pelanggan: r.customer?.name || "", Item: (r.items || []).map((it) => `${it.desc} (${it.qty} ${it.unit || ""} x ${it.price})`).join("; "), "Subtotal (Rp)": r.subtotal, "Diskon (Rp)": r.discount, "PPN (Rp)": r.ppn, "Total (Rp)": r.total, Status: r.status || "Belum Lunas" })), ["No. Invoice", "Tanggal", "Jatuh Tempo", "ID Pelanggan", "Pelanggan", "Item", "Subtotal (Rp)", "Diskon (Rp)", "PPN (Rp)", "Total (Rp)", "Status"]);
  const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  downloadBlob(new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), `Data Galeri Florist ${todayISO()}.xlsx`);
  toast("File Excel tersimpan di folder Download.");
}

    case "addItem": d.items.push(newItem()); saveDraftLocal(); render(); $(`#p-${d.items.length - 1}`)?.focus(); break;
    case "delItem": d.items.splice(+b.dataset.i, 1); saveDraftLocal(); render(); break;

      const type = (S.editing.draft && S.editing.draft.type) || old.type || S.editing.type || "Masuk";
      const data = { date: $("#kDate").value || todayISO(), type, category: $("#kCat").value, amount, note: $("#kNote").value.trim(), method: $("#kMethod").value, arranger: type === "Keluar" ? ($("#kArranger")?.value || "").trim() : "", createdAt: old.createdAt || new Date().toISOString() };
      await go(async () => { await put("cash", cid, data); S.editing = null; toast(type === "Masuk" ? "Uang masuk tercatat." : "Uang keluar tercatat."); render(); });
      break; }
    case "kasDel": S.confirmDelete = id; render(); break;
    case "kasDelYes": await go(async () => { await remove("cash", id); S.confirmDelete = null; render(); }); break;
    case "kasExport": kasExport(); break;
    case "setStatus": d.status = b.dataset.k; saveDraftLocal(); render(); break;
    case "closeSaved": S.lastSaved = null; render(); break;
    case "pdf": { const r = S.invoices.find((x) => x.id === id); if (r) await savePdf(r, "share"); break; }
    case "pdfDl": { const r = S.invoices.find((x) => x.id === id); if (r) await savePdf(r, "download"); break; }
    case "connect": await go(() => connect($("#sUrl").value, $("#sKey").value)); break;
    case "refresh": await go(() => pull()); break;
    case "install": if (S.installEvt) { S.installEvt.prompt(); try { await S.installEvt.userChoice; } catch {} S.installEvt = null; render(); } break;
    case "copyLink": { const link = setupLink(); try { await navigator.clipboard.writeText(link); toast("Link admin disalin. Tempel di WhatsApp."); } catch { if (navigator.share) { try { await navigator.share({ text: link }); } catch {} } else toast(link); } break; }
    case "disconnect": S.confirmDelete = "__disconnect"; render(); break;
    case "disconnectYes": lsSet(CFG_KEY, null); lsSet(CACHE_KEY, null); S.cfg = null; S.confirmDelete = null; S.customers = []; S.products = []; S.accounts = []; S.invoices = []; S.cash = []; render(); break;
    case "togglePaid": { const r = S.invoices.find((x) => x.id === id); if (r) await go(async () => { await put("invoices", id, { ...clean(r), status: r.status === "Lunas" ? "Belum Lunas" : "Lunas", paidAt: r.status === "Lunas" ? "" : new Date().toISOString() }); render(); }); break; }
    case "editInv": case "dupInv": {
      const r = S.invoices.find((x) => x.id === id); if (!r) return;
      const findAcc = (a) => a && S.accounts.find((x) => x.number === a.number)?.id || "";
      S.draft = {
        number: act === "editInv" ? r.number : nextInvoiceNumber(todayISO()),
        date: act === "editInv" ? r.date : todayISO(),
        dueDays: Math.max(0, Math.round((new Date(r.due) - new Date(r.date)) / 864e5)) || S.biz.dueDays,
        customerId: S.customers.some((c) => c.id === r.customerId) ? r.customerId : "",
        items: (r.items || []).map((it) => ({ ...it })), discountPct: r.discountPct || 0, ppnPct: act === "editInv" ? (r.ppnPct || "") : "",
        acc1: findAcc(r.accounts?.[0]), acc2: findAcc(r.accounts?.[1]), note: r.note || "",
        status: act === "editInv" ? (r.status || "Belum Lunas") : "Belum Lunas",
        editingId: act === "editInv" ? r.id : null,
      };
      if (!S.draft.items.length) S.draft.items = [newItem()];
      S.numberTouched = act === "editInv"; saveDraftLocal(); S.view = "buat"; render(); window.scrollTo(0, 0);
      toast(act === "editInv" ? "Mengubah " + r.number : "Disalin sebagai invoice baru."); break; }
    case "doImport": await go(doImport); break;
    case "cancelImport": S.pendingImport = null; render(); break;
    case "export": await go(exportExcel); break;
  }
});

document.addEventListener("input", (e) => {
  const t = e.target, d = S.draft;
  if (t.id === "hQuery") { S.histQuery = t.value; const pos = t.selectionStart; render(); const n = $("#hQuery"); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (t.id === "cQuery") { S.custQuery = t.value; const pos = t.selectionStart; render(); const n = $("#cQuery"); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (S.view !== "buat") return;
  if (t.dataset.f && t.tagName === "INPUT") {
    const it = d.items[+t.dataset.i]; const f = t.dataset.f;
    it[f] = f === "price" ? num(t.value) : f === "qty" ? (t.value.replace(",", ".")) : t.value;
    if (f === "desc" && it.productId) { /* keep link but allow edits */ }
  }
  else if (t.id === "fNumber") { d.number = t.value; S.numberTouched = true; }
  else if (t.id === "fDue") { d.dueDays = num(t.value); $("#dueText").textContent = tglID(addDays(d.date, d.dueDays)); }
  else if (t.id === "fDisc") d.discountPct = t.value.replace(",", ".");
  else if (t.id === "fPpn") { d.ppnPct = t.value.replace(",", "."); d.ppnTouched = true; }
  else if (t.id === "fNote") d.note = t.value;
  else return;
  saveDraftLocal(); updateTotals();
});

document.addEventListener("change", (e) => {
  const t = e.target, d = S.draft;
  if (t.id === "xlsFile" && t.files && t.files[0]) { readExcel(t.files[0]); t.value = ""; return; }
  if (t.id === "dPeriod") { S.dashPeriod = t.value; render(); return; }
  if (t.id === "kPeriod") { S.kasPeriod = t.value; render(); return; }
  if (t.id === "kAmount") { const n = num(t.value); t.value = n ? n.toLocaleString("id-ID") : ""; return; }
  if (S.view !== "buat") return;
  if (t.dataset.f === "productId") {
    const it = d.items[+t.dataset.i]; it.productId = t.value;
    const p = S.products.find((x) => x.id === t.value);
    if (p) { it.desc = p.name; it.unit = p.unit || ""; it.price = Number(p.price) || 0; }
    saveDraftLocal(); render(); return;
  }
  if (t.dataset.f === "price") { t.value = d.items[+t.dataset.i].price ? Number(d.items[+t.dataset.i].price).toLocaleString("id-ID") : ""; return; }
  if (t.id === "fDate") { d.date = t.value || todayISO(); d.dateTouched = d.date !== todayISO(); if (!S.numberTouched && !d.editingId) d.number = nextInvoiceNumber(d.date); saveDraftLocal(); render(); return; }
  if (t.id === "fDueDate") { if (t.value) d.dueDays = Math.max(0, Math.round((new Date(t.value + "T00:00:00") - new Date(d.date + "T00:00:00")) / 864e5)); saveDraftLocal(); render(); return; }
  if (t.id === "fCustomer") { d.customerId = t.value; saveDraftLocal(); render(); if (t.value === "__new") $("#cName")?.focus(); return; }
  if (t.id === "fAcc1") { d.acc1 = t.value; d.accTouched = true; saveDraftLocal(); return; }
  if (t.id === "fAcc2") { d.acc2 = t.value; d.accTouched = true; saveDraftLocal(); return; }
});

$("#btnSavePdf").addEventListener("click", async () => {
  const d = S.draft;
  if (!d.customerId || d.customerId === "__new") { toast("Pilih atau simpan pelanggan dulu."); $("#fCustomer")?.focus(); return; }
  const inv = invoiceFromDraft();
  if (!inv.number) { toast("Isi nomor invoice."); return; }
  if (!inv.items.length) { toast("Tambahkan minimal satu item dengan deskripsi dan qty."); return; }
  const dup = S.invoices.find((x) => x.number === inv.number && x.id !== d.editingId);
  if (dup) { toast(`Nomor ${inv.number} sudah dipakai. Ganti nomor invoice.`); $("#fNumber")?.focus(); return; }
  const btn = $("#btnSavePdf"); btn.disabled = true;
  const id = d.editingId || uid();
  const old = S.invoices.find((x) => x.id === id);
  const paidAt = inv.status === "Lunas" ? (old?.status === "Lunas" && old.paidAt) || new Date().toISOString() : "";
  const rec = { ...inv, paidAt, createdAt: old?.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString() };
  const ok = await put("invoices", id, rec).then(() => true, () => false);
  if (ok) {
    S.lastSaved = id;
    S.draft = freshDraft(); S.numberTouched = false; S.draft.number = nextInvoiceNumber(S.draft.date); saveDraftLocal();
    render(); window.scrollTo(0, 0); toast(`${rec.number} tersimpan. Unduh atau kirim PDF-nya di atas.`);
  }
  btn.disabled = false; updateTotals();
});

/* ---------- boot ---------- */
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); S.installEvt = e; softRender(); });
window.addEventListener("appinstalled", () => { S.installEvt = null; toast("Aplikasi terpasang."); softRender(); });
// A new invoice follows today's date unless the date was picked by hand.
function rollDraftDate() {
  const d = S.draft, today = todayISO();
  if (!d || d.editingId || d.dateTouched || d.date === today) return false;
  d.date = today; if (!S.numberTouched) d.number = nextInvoiceNumber(today); saveDraftLocal(); return true;
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { if (rollDraftDate()) softRender(); pull(true); } });
setInterval(() => { if (document.visibilityState === "visible") pull(true); }, 90000);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

loadDraftLocal();
// PPN is typed by hand on every invoice; drop the old automatic 11% from a saved draft.
if (S.draft && !S.draft.editingId && !S.draft.ppnTouched) S.draft.ppnPct = "";
const cached = lsGet(CACHE_KEY); if (cached) applyData(cached);
if (!S.draft) S.draft = freshDraft();
rollDraftDate();
const fromLink = readSetupHash();
if (fromLink) { S.setupPrefill = fromLink; if (!S.cfg || S.cfg.url !== fromLink.url || S.cfg.key !== fromLink.key) { S.cfg = null; render(); connect(fromLink.url, fromLink.key); } }
render(); setSync();
if (S.cfg) pull(true);
</script>
</body>
</html>
